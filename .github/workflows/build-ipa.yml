name: Build BookScan PDF IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: List Project Schemes
        run: |
          xcodebuild -list -project BookScanPDF/BookScanPDF.xcodeproj

      - name: Build Application Bundle (Unsigned for Sideloading)
        run: |
          xcodebuild build \
            -project BookScanPDF/BookScanPDF.xcodeproj \
            -scheme BookScanPDF \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle"
            exit 1
          fi
          echo "Found built .app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 BookScanPDF.ipa Payload
          ls -lh BookScanPDF.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookScanPDF-iOS15-Release-IPA
          path: build/BookScanPDF.ipa
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "BookScan PDF v1.0.0 (Release Build)"
          body: |
            ## BookScan PDF v1.0.0 — Production IPA
            - **Target Platform:** iOS 15.0+ (Tested against iPhone 7 Plus / A10 Fusion, 3 GB RAM)
            - **Features:**
              - 100% Offline: Zero servers, zero telemetry, zero analytics.
              - Live Continuous Camera: Capture 500+ pages without closing the viewfinder.
              - Vision + Core Motion Smart Indicator: Real-time Green/Amber/Red alignment.
              - Bounded Concurrency: Disk-first image storage maintaining < 150 MB peak RAM.
              - Cascade Settings: Page 1 edits cascade to all pages automatically.
              - Direct DCTDecode Streaming PDF: Zero image re-compression, 100% fidelity.
              - Two-Page Spread Splitter with Gutter Valley Analysis & RTL Support.
              - On-Device OCR Searchable Text Layer (Mode 3 Tr).
            - **Installation Instructions:**
              - Sideload `BookScanPDF.ipa` via AltStore, Sideloadly, TrollStore, or Apple Configurator.
          files: build/BookScanPDF.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
